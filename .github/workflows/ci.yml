name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libusb-1.0-0 libudev1 libcap2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Python compile check
        run: python -m compileall -q app tools tests
      - name: Tests
        run: python -m pytest -q
      - name: Shell syntax
        run: bash -n run.sh run_mock.sh run_real.sh tools/install_zlg_sdk.sh tools/install_udev_rule.sh
