name: Bootstrap CANopy source

on:
  push:
    paths:
      - ".bootstrap/source.part*"
      - ".github/workflows/bootstrap.yml"
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and publish source
        shell: bash
        run: |
          set -euo pipefail

          cat .bootstrap/source.part* | base64 -d > /tmp/canopy-source.tar.gz
          gzip -t /tmp/canopy-source.tar.gz
          sha256sum /tmp/canopy-source.tar.gz
          tar -xzf /tmp/canopy-source.tar.gz
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No source changes to publish."
            exit 0
          fi

          git commit -m "Initial release: CANopy CAN/CAN FD workbench"
          git push
