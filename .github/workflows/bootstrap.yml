name: Bootstrap CANopy source

on:
  push:
    paths:
      - ".bootstrap/v2.part*"
      - ".github/workflows/bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and publish source
        shell: bash
        run: |
          set -euo pipefail

          cat .bootstrap/v2.part* | base64 -d > /tmp/canopy-source.tar.gz
          echo "1a26b293bfab9fd7ad7ed0fe5e23578f865a9848eab938e84a520ac342911fd5  /tmp/canopy-source.tar.gz" | sha256sum -c -
          gzip -t /tmp/canopy-source.tar.gz
          tar -xzf /tmp/canopy-source.tar.gz

          rm -rf .bootstrap
          rm -f .github/workflows/ci.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No source changes to publish."
            exit 0
          fi

          git commit -m "Initial release: CANopy CAN/CAN FD workbench"
          git push
